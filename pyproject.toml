[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ppan"
version = "0.1"
description = "Piano performance video analysis."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Uros Zivanovic", email = "uki@cro.moe"}
]
dependencies = [
    "Cython",
    "numpy",
    "mido",
    "rach3datautils @ git+https://github.com/neosatrapahereje/rach3datautils@main#egg=rach3datautils",
    "tqdm",
    "partitura",
    "transformers[torch]",
    "matplotlib",
    "torchvision",
    "mir_eval",
    "python-dotenv",
    "torch",
    "pillow",
    "nvidia-dali-cuda120",
    "wandb",
    "av"
]

[project.urls]
Repository = "https://github.com/Chromeilion/ppan"

[tool.setuptools.packages.find]
include = ["ppan"]

[project.scripts]
ppan = "ppan.__main__:main"
