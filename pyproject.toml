[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ppan"
version = "0.1"
description = "Piano performance video analysis."
requires-python = ">=3.9"
authors = [
    {name = "Anonymous"}
]
dependencies = [
    "numpy",
    "mido",
    "tqdm",
    "transformers[torch]",
    "matplotlib",
    "torchvision",
    "torch",
    "pillow",
    "nvidia-dali-cuda120",
    "timm",
]

[tool.setuptools.packages.find]
include = ["ppan"]

[project.scripts]
ppan = "ppan.__main__:main"
