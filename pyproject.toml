[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ppan"
version = "0.1"
description = "Piano performance video analysis."
requires-python = ">=3.9"
authors = [
    {name = "Anonymous"}
]
dependencies = [
    "numpy",
    "mido",
    "tqdm",
    "transformers[torch]==4.44.2",
    "matplotlib",
    "torchvision",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "pillow",
    "nvidia-dali-cuda120",
    "timm",
    "partitura"
]

[tool.setuptools.packages.find]
include = ["ppan"]
